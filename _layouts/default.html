<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% feed_meta %}
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#7a1f5c"
          }
        }
      }
    }
  </script>
  {% if jekyll.environment == "production" %}
  <script src="https://cdn.usefathom.com/script.js" data-site="FLESYFAW" defer></script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="bg-white text-gray-900 antialiased flex min-h-screen flex-col">
  <header class="border-t-8 border-brand">
    <div class="mx-auto flex w-[min(100vw_-_3rem,80rem)] items-center justify-between py-6">
      <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-brand">
        <svg aria-hidden="true" viewBox="0 4 64 44" class="h-7 w-auto" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 44 A26 26 0 0 1 12.1 27.3 L11 8 L23.1 19.6 A26 26 0 0 1 40.9 19.6 L53 8 L51.9 27.3 A26 26 0 0 1 58 44"/>
          <circle cx="23" cy="28" r="1.6" fill="currentColor" stroke="none"/>
          <circle cx="41" cy="28" r="1.6" fill="currentColor" stroke="none"/>
          <path d="M28.5 33 H35.5 L38 36 L32 42 L26 36 Z" fill="currentColor"/>
          <path d="M26 36 H38 M28.5 33 L30.5 36 L32 42 M35.5 33 L33.5 36 L32 42" stroke="#fff" stroke-opacity="0.55" stroke-width="1"/>
          <path d="M2 34 L14 36 M2 41 L14 40 M62 34 L50 36 M62 41 L50 40" stroke-width="2"/>
        </svg>
        {{ site.title }}
      </a>
      <nav class="flex gap-6 text-sm text-gray-600">
        <a href="{{ '/blog/' | relative_url }}" class="hover:text-gray-900">Blog</a>
      </nav>
    </div>
  </header>
  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-16">
    {{ content }}
  </main>
  <footer class="border-t-8 border-brand">
    <div class="mx-auto flex w-[min(100vw_-_3rem,80rem)] justify-between gap-6 py-8 text-sm text-gray-600">
      <span>&copy; {{ site.time | date: "%Y" }} Guided Rails, LLC. All rights reserved.</span>
      <nav class="flex gap-6">
        <a href="{{ '/accessibility/' | relative_url }}" class="hover:text-gray-900">Accessibility</a>
        <a href="{{ '/license/' | relative_url }}" class="hover:text-gray-900">License</a>
        <a href="{{ '/privacy/' | relative_url }}" class="hover:text-gray-900">Privacy</a>
      </nav>
    </div>
  </footer>
</body>
</html>
