<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#7a1f5c"
          }
        }
      }
    }
  </script>
  {% if jekyll.environment == "production" %}
  <script src="https://cdn.usefathom.com/script.js" data-site="FLESYFAW" defer></script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="bg-white text-gray-900 antialiased flex min-h-screen flex-col">
  <header class="border-t-8 border-brand">
    <div class="mx-auto flex w-[min(100vw_-_3rem,80rem)] items-center justify-between py-6">
      <a href="{{ '/' | relative_url }}" class="text-lg font-semibold tracking-tight text-brand">{{ site.title }}</a>
      <nav class="flex gap-6 text-sm text-gray-600">
        <a href="{{ '/blog/' | relative_url }}" class="hover:text-gray-900">Blog</a>
      </nav>
    </div>
  </header>
  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-16">
    {{ content }}
  </main>
  <footer class="border-t-8 border-brand">
    <div class="mx-auto flex w-[min(100vw_-_3rem,80rem)] justify-between gap-6 py-8 text-sm text-gray-600">
      <span>&copy; {{ site.time | date: "%Y" }} Guided Rails, LLC. All rights reserved.</span>
      <nav class="flex gap-6">
        <a href="{{ '/accessibility/' | relative_url }}" class="hover:text-gray-900">Accessibility</a>
        <a href="{{ '/license/' | relative_url }}" class="hover:text-gray-900">License</a>
        <a href="{{ '/privacy/' | relative_url }}" class="hover:text-gray-900">Privacy</a>
      </nav>
    </div>
  </footer>
</body>
</html>
